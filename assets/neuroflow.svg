    <text x="260" y="125" fill="#E0F2FE" font-size="18" font-weight="700">PREP</text>
    <text x="260" y="145" fill="#E0F2FE" font-size="11">denoise + filter</text>

    <rect x="365" y="90" width="160" height="70" rx="16" fill="#8B5CF6" fill-opacity="0.95" filter="url(#shadow)"/>
